[project]
name = "piano-sync-switcher"
version = "0.1.0"
description = "Align two performances of the same piece and generate an A/B comparison video."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23,<2",
    "scipy>=1.9",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
piano-sync-switcher = "pianosync.ui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["pianosync*"]
